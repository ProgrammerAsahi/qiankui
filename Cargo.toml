[package]
name = "qiankui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A modular, self-hosted private networking relay with replaceable transports."
license = "Apache-2.0"
repository = "https://github.com/ProgrammerAsahi/qiankui"
default-run = "qiankui"

[features]
default = ["client-update"]
client-update = [
    "dep:minisign-verify",
    "dep:semver",
    "dep:serde_json",
    "dep:tempfile",
    "dep:ureq",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
minisign-verify = { version = "0.2.5", optional = true }
rpassword = "7"
semver = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = "0.10"
subtle = "2"
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "0.9"
ureq = { version = "3.3", default-features = false, features = ["rustls"], optional = true }
url = "2"
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[[bin]]
name = "qiankui"
path = "src/bin/qiankui.rs"
required-features = ["client-update"]

[[bin]]
name = "qiankui-relay"
path = "src/bin/qiankui-relay.rs"
