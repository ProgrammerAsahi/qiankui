name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-targets --locked
      - name: Build release binaries
        run: cargo build --release --locked
      - name: Check Azure deployment scripts
        run: bash -n deploy/azure/*.sh
      - name: Validate Azure region manifest
        run: |
          jq -e '
            .schemaVersion == 1
            and (.sharedLocation | type == "string" and length > 0)
            and (.regions | type == "array" and length > 0)
            and ([.regions[].slug] | length == (unique | length))
            and all(.regions[];
              (.slug | type == "string" and test("^[a-z0-9][a-z0-9-]*$"))
              and (.location | type == "string" and length > 0)
              and (.networkAddressPrefix | type == "string" and length > 0)
              and (.infrastructureSubnetAddressPrefix | type == "string" and length > 0)
            )
          ' deploy/azure/regions.json
      - name: Compile Azure Bicep
        run: |
          az bicep build --file deploy/azure/shared.bicep --outfile /tmp/qiankui-shared.json
          az bicep build --file deploy/azure/region.bicep --outfile /tmp/qiankui-region.json
          az bicep build --file deploy/azure/secret-access.bicep --outfile /tmp/qiankui-secret-access.json
          az bicep build --file deploy/azure/app.bicep --outfile /tmp/qiankui-app.json
